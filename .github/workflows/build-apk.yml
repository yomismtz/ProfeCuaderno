name: Build Android APK and AAB

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - "backend/**"
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "backend/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK and AAB
        run: gradle :app:assembleDebug :app:bundleDebug --stacktrace

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ProfeCuaderno-debug-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab

      - name: Prepare public APK
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/debug/app-debug.apk ProfeCuaderno.apk

      - name: Publish rolling Android download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-latest "$GITHUB_SHA"
          git push origin -f android-latest
          NOTES="APK Android de prueba generado automáticamente desde main. Commit: $GITHUB_SHA"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest ProfeCuaderno.apk --clobber
            gh release edit android-latest --title "ProfeCuaderno · descarga Android" --notes "$NOTES" --prerelease
          else
            gh release create android-latest ProfeCuaderno.apk --target "$GITHUB_SHA" --title "ProfeCuaderno · descarga Android" --notes "$NOTES" --prerelease
          fi
