name: Fix GET_CONTENT file picker
on:
  push:
    paths:
      - '.github/workflows/fix-getcontent-picker.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch teacher file pickers
        run: |
          python - <<'PY'
          from pathlib import Path
          g=Path('app/src/main/java/com/profecuaderno/app/ui/GuideScreen.kt')
          s=g.read_text()
          s=s.replace('ActivityResultContracts.OpenDocument()', 'ActivityResultContracts.GetContent()')
          s=s.replace('pickerLauncher.launch(DocumentImportPolicy.mimeTypes)', 'pickerLauncher.launch("*/*")')
          s=s.replace('runCatching { context.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) }\n            true\n        }.getOrDefault(false)', 'false')
          s=s.replace('pickerMessage = "No pude abrir el selector de documentos de Android. Revisa que la app Archivos/Files del sistema esté habilitada."\n                showFileHelp = true', 'pickerMessage = "No pude abrir el selector de documentos de Android."')
          g.write_text(s)

          p=Path('app/src/main/java/com/profecuaderno/app/ui/StudentsScreen.kt')
          s=p.read_text()
          start='val pickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->\n        ExternalActivityGuard.active = false\n        if (result.resultCode == Activity.RESULT_OK) importUri(result.data?.data)\n        else importMessage = "No se seleccionó ningún archivo."\n    }'
          repl='val pickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->\n        ExternalActivityGuard.active = false\n        importUri(uri)\n    }'
          s=s.replace(start,repl)
          old='''        val mimeTypes = arrayOf("text/csv", "text/plain", "application/vnd.ms-excel", "application/csv", "application/octet-stream")\n        val chooser = DocumentPickerCompat.chooserIntent(mimeTypes, "Seleccionar archivo CSV")\n        if (!DocumentPickerCompat.canResolve(context, chooser)) {\n            showFileHelp = true\n            return\n        }\n        ExternalActivityGuard.active = true\n        runCatching { pickerLauncher.launch(chooser) }\n            .onFailure {\n                ExternalActivityGuard.active = false\n                showFileHelp = true\n            }'''
          new='''        ExternalActivityGuard.active = true\n        runCatching { pickerLauncher.launch("*/*") }\n            .onFailure {\n                ExternalActivityGuard.active = false\n                importMessage = "No pude abrir el selector de archivos de Android."\n            }'''
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/profecuaderno/app/ui/GuideScreen.kt app/src/main/java/com/profecuaderno/app/ui/StudentsScreen.kt
          git diff --cached --quiet || git commit -m "Use compatible file picker without storage permission"
          git push
