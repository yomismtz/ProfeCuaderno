name: Wire team grading
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TeamFormationScreen
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/profecuaderno/app/ui/TeamFormationScreen.kt')
          s=p.read_text()
          needle='''                        formation.teams.forEach { team ->\n                            val names = team.studentIds.mapNotNull { id -> students.firstOrNull { it.id == id }?.name }\n                            Text("${team.name}: ${names.joinToString(", ").ifBlank { "Sin alumnos" }}", style = MaterialTheme.typography.bodySmall)\n                        }\n'''
          repl=needle+'''                        TeamActivityGradingCard(\n                            db = db,\n                            period = period,\n                            formation = formation,\n                            onChanged = onChanged,\n                            showParticipationReview = true\n                        )\n'''
          if 'showParticipationReview = true' not in s:
              if needle not in s: raise SystemExit('anchor not found')
              s=s.replace(needle,repl,1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/profecuaderno/app/ui/TeamFormationScreen.kt
          git diff --cached --quiet || git commit -m "Show grading controls in team history"
          git push
